<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數字星球｜因數與倍數應用</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#eaf6f7;color:#173951}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#c2e7ee,#f7faf8 68%);min-height:100vh}.wrap{max-width:790px;margin:auto;padding:20px 16px 65px}.back{color:#27637d;text-decoration:none;font-weight:800}.hero{background:linear-gradient(125deg,#1d5b80,#438eaa);color:white;border-radius:22px;padding:26px;margin:20px 0;box-shadow:0 10px 26px #1b5c8130}h1{font-size:clamp(24px,6vw,34px);margin:9px 0}.hero p{line-height:1.7;opacity:.96}.card{background:#fff;border-radius:20px;padding:21px;margin:16px 0;box-shadow:0 7px 25px #1c5b7815;border:1px solid #d8e6e7}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;padding:15px;background:#f2f7fa;border:2px solid #dce8eb;border-radius:14px;font-size:17px;cursor:pointer;color:#173951}.choice:hover{border-color:#61a8c3}.choice.right{background:#def5e6;border-color:#24975e}.choice.wrong{background:#ffebeb;border-color:#d45858}.choice:disabled{cursor:default}button,select{font:inherit}.btn{background:#e3ab4d;color:#352709;border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.btn2{background:#e6f0f4;border:1px solid #b8d4df;color:#245772;padding:11px 14px;border-radius:12px;cursor:pointer}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar select{border:1px solid #aac8d6;border-radius:10px;background:white;padding:10px}.muted{color:#6a8390;font-size:14px}.pill{display:inline-block;background:#d9edf2;color:#24627c;font-size:13px;padding:5px 11px;border-radius:25px;font-weight:800}.prompt{font-size:20px;line-height:1.95;white-space:pre-wrap}.feedback{background:#f0f9f6;border-left:4px solid #2b956a;padding:16px;border-radius:12px;line-height:2;margin-top:15px}.progress{height:9px;background:#e5edf1;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#62b5ad;transition:width .2s}.stats{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-weight:800}.intro{line-height:1.8}.rule{display:grid;gap:10px}.rule div{background:#f3f8fa;padding:11px 13px;border-radius:11px}#next{margin-top:15px}footer{text-align:center;color:#73919b;margin-top:25px;font-size:12px}@media(max-width:550px){.card{padding:16px}.prompt{font-size:18px}.hero{padding:20px}}</style></head><body><div class="wrap"><a class="back" href="./">← 返回知識群島</a><section class="hero"><span class="pill">七年級上學期 · 第二次段考</span><h1>🧮 數字星球｜因數與倍數</h1><p>依照教學影片的三種母題設計：分配剩餘、週期重合、缺少反推。每次重新生成題目，解題方法不變，數字與情境會改變。</p></section><div class="card intro"><b>📘 影片三大解題口訣</b><div class="rule"><div>① 剩下的，沒有分出去 → 先扣掉剩餘，再找最大公因數</div><div>② 一起出現，要等多久 → 找最小公倍數，再加回開始時間</div><div>③ 還差的，要加回總量 → 先補足缺少，再除以每人分得數</div></div></div><div class="card"><div class="toolbar"><label for="type"><b>挑戰類型</b></label><select id="type"><option value="all">三種混合</option><option value="gcd">分配剩餘｜最大公因數</option><option value="lcm">週期重合｜最小公倍數</option><option value="short">缺少反推｜回補總量</option></select><label for="count"><b>每回合</b></label><select id="count"><option value="10">10 題</option><option value="20">20 題</option><option value="30">30 題</option></select><button class="btn" id="restart">開始新挑戰</button></div><p class="muted">每題四選一；作答後會顯示完整算式。個人最高分僅儲存在這台裝置。</p></div><section class="card" id="game" aria-live="polite"></section><footer>知識群島 · 國一數學母題延伸練習｜非原影片題目逐字複製</footer></div><script>
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rand(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;
const pad=x=>String(x).padStart(2,'0'),time=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
function alternatives(correct,unit){let values=new Set([correct]);let shifts=[-20,-12,-10,-8,-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,8,10,12,20,30,60];for(let i=0;i<120&&values.size<4;i++){let n=correct+pick(shifts);if(unit==='time')n=correct+pick([-60,-40,-30,-20,-15,-10,10,15,20,30,40,60]);if(n>0&&n!==correct)values.add(n)}return [...values].sort(()=>Math.random()-.5).map(v=>({value:v,label:unit==='time'?time(v):v+' '+unit}))}
function gcdQ(){let n=rand(8,30),k=rand(3,9),l=rand(3,9);while(gcd(k,l)!==1)l=rand(2,10);let r1=rand(1,Math.min(5,n-1)),r2=rand(1,Math.min(5,n-1)),a=n*k+r1,b=n*l+r2;let theme=pick([['貼紙','卡片','張'],['糖果','餅乾','個'],['紅色珠子','藍色珠子','顆']]);return {type:'分配剩餘',q:'有'+a+theme[2]+theme[0]和'+b+theme[2]+theme[1]，要平均分給一些同學，每位同學拿到的'+theme[0]數量都相同、'+theme[1]數量也都相同。分完後，'+theme[0]剩'+r1+theme[2]、'+theme[1]剩'+r2+theme[2]。最多可以分給幾位同學？',value:n,unit:'人',ex:'先扣除未分出去的部分：'+a+'－'+r1+'＝'+(a-r1)+'；'+b+'－'+r2+'＝'+(b-r2)+'。<br>同樣分給最多人，求最大公因數：gcd('+(a-r1)+', '+(b-r2)+')＝<b>'+n+'</b>。<br>答案：'+n+' 人。'} }
function lcmQ(){let pairs=[[12,18],[15,20],[16,20],[18,24],[20,30],[24,36],[12,16],[15,25],[24,40],[18,30]];let [a,b]=pick(pairs),minute=rand(5,8)*60+pick([0,10,20,30,40,50]);let delay=lcm(a,b),names=pick([['甲車','乙車','班車'],['甲鐘','乙鐘','時鐘'],['紅燈','綠燈','號誌']]);let start=time(minute),end=time(minute+delay);return {type:'週期重合',q:names[0]每隔 '+a+' 分鐘出現一次，'+names[1]每隔 '+b+' 分鐘出現一次。今天早上 '+start+' 兩者剛好同時出現，下一次同時出現是在幾點幾分？',value:minute+delay,unit:'time',ex:'一起出現要找最小公倍數：lcm('+a+', '+b+')＝<b>'+delay+' 分鐘</b>。<br>'+delay+' 分鐘＝'+Math.floor(delay/60)+' 小時 '+(delay%60)+' 分鐘。<br>'+start+' 加上 '+delay+' 分鐘＝<b>'+end+'</b>。'} }
function shortQ(){let students=rand(5,13),each=rand(3,8),missing=rand(1,each-1),owned=students*each-missing,thing=pick(['糖果','原子筆','貼紙','餅乾']);return {type:'缺少反推',q:'老師原本有 '+owned+' 個'+thing+'，想讓每位同學分到 '+each+' 個，但全部分完仍然差 '+missing+' 個才夠每人拿到 '+each+' 個。請問一共有幾位同學？',value:students,unit:'人',ex:'不足的要先補回去：'+owned+'＋'+missing+'＝'+(owned+missing)+' 個。<br>再除以每人分到的數量：'+(owned+missing)+' ÷ '+each+'＝<b>'+students+' 人</b>。'} }
let session=[],pos=0,score=0,locked=false;function make(){let type=$('type').value,types=type==='all'?['gcd','lcm','short']: [type];return ({gcd:gcdQ,lcm:lcmQ,short:shortQ})[pick(types)]()}
function start(){pos=0;score=0;session=Array.from({length:Number($('count').value)},make);render()}
function render(){if(pos>=session.length){let best=0;try{best=Number(localStorage.getItem('knowledge-islands-math-video-best')||0)}catch(e){};best=Math.max(best,Math.round(100*score/session.length));try{localStorage.setItem('knowledge-islands-math-video-best',String(best))}catch(e){};$('game').innerHTML='<h2>🏁 完成挑戰！</h2><p class="prompt">答對 '+score+' / '+session.length+' 題（'+Math.round(100*score/session.length)+' 分）</p><p>本機最高成績：'+best+' 分</p><button class="btn" id="again">再挑戰一回</button>';$('again').onclick=start;return}
locked=false;let q=session[pos],opts=alternatives(q.value,q.unit);$('game').innerHTML='<div class="stats"><span>第 '+(pos+1)+' / '+session.length+' 題</span><span>已答對 '+score+' 題</span></div><div class="progress"><div style="width:'+(pos/session.length*100)+'%"></div></div><p><span class="pill">'+q.type+'</span></p><p class="prompt">'+q.q+'</p><div class="choices" id="choices"></div><div id="feedback"></div>';let out=$('choices');opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='ABCD'[i]+'.  '+o.label;b.onclick=()=>{if(locked)return;locked=true;let hit=o.value===q.value;if(hit)score++;[...out.children].forEach(x=>{x.disabled=true;if(x.dataset.value===String(q.value))x.classList.add('right')});if(!hit)b.classList.add('wrong');$('feedback').innerHTML='<div class="feedback"><b>'+(hit?'✅ 答對了！':'📖 再看一次計算步驟')+'</b><br>'+q.ex+'</div><button class="btn" id="next">'+(pos+1===session.length?'看本回合成績':'下一題 →')+'</button>';$('next').onclick=()=>{pos++;render()}};b.dataset.value=String(o.value);out.appendChild(b)})}
$('restart').onclick=start;start();
</script></body></html>
